name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Verify tag matches package.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "tag=$TAG_VERSION pkg=$PKG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch — bump package.json to $TAG_VERSION before tagging."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # OIDC trusted publishing requires npm 11.5+; Node 22 ships with 10.9.
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest

      - name: Publish to npm
        # Auth via OIDC (Trusted Publishers configured on npmjs.com).
        # No NODE_AUTH_TOKEN — npm prefers the env token if present.
        run: npm publish --access public --provenance

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  bump-homebrew:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Wait for npm tarball + compute sha256
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://registry.npmjs.org/@diagrammo/dgmo/-/dgmo-${VERSION}.tgz"
          for i in 1 2 3 4 5 6; do
            if curl -sIfL "$URL" >/dev/null; then
              SHA=$(curl -sL "$URL" | shasum -a 256 | cut -d' ' -f1)
              echo "VERSION=$VERSION" >> "$GITHUB_ENV"
              echo "URL=$URL" >> "$GITHUB_ENV"
              echo "SHA=$SHA" >> "$GITHUB_ENV"
              echo "✓ tarball available, sha=$SHA"
              exit 0
            fi
            echo "waiting for npm tarball ($i/6)..."
            sleep 10
          done
          echo "::error::npm tarball did not appear within 60s"
          exit 1

      - name: Checkout homebrew-dgmo
        uses: actions/checkout@v5
        with:
          repository: diagrammo/homebrew-dgmo
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-dgmo

      - name: Update formula and open PR
        run: |
          cd homebrew-dgmo
          sed -i "s|url \".*\"|url \"$URL\"|" Formula/dgmo.rb
          sed -i "s|sha256 \".*\"|sha256 \"$SHA\"|" Formula/dgmo.rb
          if git diff --quiet; then
            echo "::warning::Formula already at $VERSION — skipping PR"
            exit 0
          fi
          git config user.name "diagrammo-bot"
          git config user.email "noreply@diagrammo.app"
          BRANCH="bump-dgmo-${VERSION}"
          git checkout -b "$BRANCH"
          git add Formula/dgmo.rb
          git commit -m "Bump dgmo to ${VERSION}"
          git push origin "$BRANCH"
          gh pr create \
            --title "Bump dgmo to ${VERSION}" \
            --body "Auto-generated by [diagrammo/dgmo release workflow](https://github.com/diagrammo/dgmo/actions/runs/${GITHUB_RUN_ID})." \
            --head "$BRANCH" \
            --base main
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

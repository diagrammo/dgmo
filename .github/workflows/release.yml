name: Release

# Tag trigger disabled 2026-07-22 to cut Actions minutes. Releases are done
# locally (see the workspace release skill / release checklist), so a tag-driven
# run was spending minutes repeating work already done by hand.
#
# 🔴 The reason recorded here originally — "the org NPM_TOKEN is broken" — was a
# WRONG DIAGNOSIS, retracted 2026-07-31. The token authenticates fine, for scoped
# and unscoped packages alike. The CI runs that looked like auth failures say
# "You cannot publish over the previously published versions", because a local
# publish had already gone out. Read the failing run own log before re-deriving
# it; a red run kept confirming the story for weeks.
#
# So: rotating the token will NOT restore this trigger and is not a precondition
# for it. Restoring it is a deliberate choice about spending Actions minutes.
# (The token does still expire ~2026-08-15 — that is a real deadline, unrelated.)
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Verify tag matches package.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "tag=$TAG_VERSION pkg=$PKG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch — bump package.json to $TAG_VERSION before tagging."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish to npm
        # OIDC via npm Trusted Publishing (configured per-package on
        # npmjs.com). No stored token — the id-token: write permission lets
        # npm verify this workflow's identity; provenance is attested too.
        run: npm publish --access public --provenance

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

# The `bump-homebrew` job that used to live here was moved to
# `bump-homebrew.yml` on 2026-08-06. The tap's `dgmo` formula installs
# @diagrammo/dgmo-cli — a different package, on its own version and its own
# `cli-v*` tag — so bumping it from the library's release is bumping the wrong
# thing. It also seds a second url/sha256 pair for a vendored `resource
# "dgmo-mcp"` block that no longer exists, which would have corrupted the
# formula. Run `bump-homebrew.yml` with the CLI version instead.

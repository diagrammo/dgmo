name: Bump Homebrew formula

# The tap's `dgmo` formula installs @diagrammo/dgmo-cli — the package that carries
# the `dgmo` binary — NOT the @diagrammo/dgmo library. Those two are published from
# this one repo on separate versions and separate tags (`v*` vs `cli-v*`), so the
# formula bump cannot ride along with the library's release job; it lives here and
# takes the CLI version it should point at.
#
# Publishing itself is done locally (see the workspace release skill). This is the
# formula half only: it waits for the tarball on npm, computes its sha256, rewrites
# the formula's single url/sha256 pair, and opens a PR on diagrammo/homebrew-dgmo.
on:
  workflow_dispatch:
    inputs:
      version:
        description: '@diagrammo/dgmo-cli version to point the formula at (e.g. 0.62.0)'
        required: true
        type: string

jobs:
  bump-homebrew:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for npm tarball + compute sha256
        run: |
          VERSION="${{ inputs.version }}"
          URL="https://registry.npmjs.org/@diagrammo/dgmo-cli/-/dgmo-cli-${VERSION}.tgz"
          for i in 1 2 3 4 5 6; do
            if curl -sIfL "$URL" >/dev/null; then
              SHA=$(curl -sL "$URL" | shasum -a 256 | cut -d' ' -f1)
              echo "VERSION=$VERSION" >> "$GITHUB_ENV"
              echo "URL=$URL" >> "$GITHUB_ENV"
              echo "SHA=$SHA" >> "$GITHUB_ENV"
              echo "✓ tarball available, sha=$SHA"
              exit 0
            fi
            echo "waiting for npm tarball ($i/6)..."
            sleep 10
          done
          echo "::error::npm tarball did not appear within 60s"
          exit 1

      - name: Checkout homebrew-dgmo
        uses: actions/checkout@v6
        with:
          repository: diagrammo/homebrew-dgmo
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-dgmo

      - name: Update formula and open PR
        run: |
          cd homebrew-dgmo
          # The formula holds exactly ONE url/sha256 pair since 2026-08-06, when the
          # vendored `resource "dgmo-mcp"` block went away — the MCP server is an
          # ordinary dependency of the CLI package now, so npm installs it. The
          # indentation anchor stays anyway: it keeps this sed off any pair that a
          # future nested block might introduce.
          sed -i "s|^  url \".*\"|  url \"$URL\"|" Formula/dgmo.rb
          sed -i "s|^  sha256 \".*\"|  sha256 \"$SHA\"|" Formula/dgmo.rb
          if git diff --quiet; then
            echo "::warning::Formula already at $VERSION — skipping PR"
            exit 0
          fi
          git config user.name "diagrammo-bot"
          git config user.email "noreply@diagrammo.app"
          BRANCH="bump-dgmo-${VERSION}"
          git checkout -b "$BRANCH"
          git add Formula/dgmo.rb
          git commit -m "Bump dgmo to ${VERSION}"
          git push origin "$BRANCH"
          gh pr create \
            --title "Bump dgmo to ${VERSION}" \
            --body "Auto-generated by [diagrammo/dgmo bump-homebrew workflow](https://github.com/diagrammo/dgmo/actions/runs/${GITHUB_RUN_ID})." \
            --head "$BRANCH" \
            --base main
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

name: Arch package repository

# Publishes the `[diagrammo]` pacman repository that Arch and Arch-derived
# machines install `dgmo` from. The repository IS this repo's `arch-repo`
# release: its assets are the package, the database, and their signatures, and
# they are replaced in place on every run. That tag is rolling and never moves.
#
#   [diagrammo]
#   Server = https://github.com/diagrammo/dgmo/releases/download/arch-repo
#
# 🔴 Why a release rather than a hosted bucket: pacman follows GitHub's asset
# redirect. Measured 2026-09-17 on Arch — `pacman -Sy` fetched the database and
# `pacman -Sw dgmo` fetched the package byte-identically through the 302. No
# bucket, no custom domain, no publish credential beyond GITHUB_TOKEN.
#
# 🔴 This repo is PUBLIC, so these runs consume none of the org's included
# Actions minutes. Do not move this job to a private repo; the minutes
# arithmetic there does not fit (see the workspace CLAUDE.md).
#
# Dispatch after a CLI release, once npm is serving the version:
#   gh workflow run arch-repo.yml -R diagrammo/dgmo -f version=X.Y.Z
on:
  workflow_dispatch:
    inputs:
      version:
        description: '@diagrammo/dgmo-cli version to package, e.g. 0.86.0'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    # makepkg, repo-add and pacman are Arch's own tools and exist nowhere else.
    container: archlinux:base-devel
    permissions:
      contents: write
    steps:
      - name: Install what the base image does not carry
        run: pacman -Sy --noconfirm --needed git github-cli nodejs npm

      - uses: actions/checkout@v6

      - name: Refuse a version npm is not serving yet
        id: target
        run: |
          VERSION="${{ inputs.version }}"
          URL="https://registry.npmjs.org/@diagrammo/dgmo-cli/-/dgmo-cli-${VERSION}.tgz"
          # The registry is eventually consistent after a publish, so give it a
          # few tries rather than failing a release-day dispatch on a race.
          for i in 1 2 3 4 5 6; do
            if curl -sIfL "$URL" >/dev/null; then
              SHA=$(curl -sL "$URL" | sha256sum | cut -d' ' -f1)
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
              echo "npm is serving $VERSION, sha256 $SHA"
              exit 0
            fi
            echo "not on npm yet, retrying in 20s ($i/6)"
            sleep 20
          done
          echo "::error::npm is not serving @diagrammo/dgmo-cli@${VERSION}. Release the CLI first."
          exit 1

      - name: Point the recipe at that version
        run: |
          cd packaging/arch
          # pkgrel counts rebuilds OF ONE VERSION, so a new version resets it to
          # 1 — otherwise a hand bump (see the comment above pkgrel in the
          # recipe) would ride along on every later release, claiming a rebuild
          # that never happened.
          CURRENT=$(awk -F= '/^pkgver=/{print $2}' PKGBUILD)
          if [ "$CURRENT" != "${{ steps.target.outputs.version }}" ]; then
            sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          fi
          sed -i "s/^pkgver=.*/pkgver=${{ steps.target.outputs.version }}/" PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('${{ steps.target.outputs.sha256 }}')/" PKGBUILD
          grep -E '^(pkgver|pkgrel|sha256sums)=' PKGBUILD

      # 🔴 A published package filename is IMMUTABLE. `package()` resolves three
      # dependencies from the npm registry at build time, so two runs of the
      # same recipe at the same version produce different bytes — and publishing
      # those under the same `name-version-pkgrel-arch.pkg.tar.zst` breaks every
      # machine that already has the old copy in /var/cache/pacman/pkg, with
      # `invalid or corrupted package (checksum)`. The database's checksum is
      # the new file's; the cache's file is the old one; pacman is right to
      # refuse it and the user cannot tell what happened.
      #
      # Reported from a real Omarchy machine on 2026-09-17, after this channel
      # was republished twice in one evening. The same filename went from
      # 10153150 to 10152855 bytes.
      #
      # So: build only what the channel does not already serve. A recipe change
      # needs a pkgrel bump, which is what pkgrel is for — the filename changes
      # with it and no cache can collide.
      - name: Is this exact package already published?
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.target.outputs.version }}"
          REL=$(awk -F= '/^pkgrel=/{print $2}' packaging/arch/PKGBUILD)
          NAME="dgmo-${VERSION}-${REL}-x86_64.pkg.tar.zst"
          echo "filename=$NAME" >> "$GITHUB_OUTPUT"
          if gh release view arch-repo --repo "$GITHUB_REPOSITORY" \
               --json assets --jq '.assets[].name' | grep -qxF "$NAME"; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME is already published — reusing it rather than rebuilding. Bump pkgrel if the recipe changed."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the package
        run: |
          # makepkg refuses to run as root, and a container is root by default.
          # This runs even when the dgmo package is being reused, because the
          # bootstrap package below still needs the builder user and the
          # PACKAGER line.
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          # Without this every package we publish is stamped "Unknown
          # Packager", which is a poor signal on a repository we are asking
          # people to add to /etc/pacman.conf. `pacman -Qi` shows it.
          echo 'PACKAGER="Diagrammo LLC <hello@diagrammo.app>"' >> /etc/makepkg.conf
          if [ "${{ steps.published.outputs.already }}" = "true" ]; then
            echo "${{ steps.published.outputs.filename }} is already served; the carry-forward below brings it back unchanged."
            exit 0
          fi
          cd packaging/arch
          sudo -u builder makepkg --noconfirm --clean
          ls -la ./*.pkg.tar.zst

      # The signing key is the owner's, and the repository is consumable without
      # it — just not verifiable. When ARCH_SIGNING_KEY is absent this publishes
      # unsigned and says so loudly in the summary, rather than failing and
      # leaving the channel with nothing at all.
      - name: Import the signing key, if there is one
        id: signing
        env:
          ARCH_SIGNING_KEY: ${{ secrets.ARCH_SIGNING_KEY }}
        run: |
          if [ -z "$ARCH_SIGNING_KEY" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ARCH_SIGNING_KEY is not set — publishing an UNSIGNED repository. Users must set SigLevel = Never, which is exactly the thing that makes a third-party repo untrustworthy. Add the secret to fix this."
            exit 0
          fi
          printf '%s' "$ARCH_SIGNING_KEY" | gpg --batch --import
          FPR=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$FPR" >> "$GITHUB_OUTPUT"
          echo "signing as $FPR"
          # 🔴 The PUBLIC half ships as an asset, and users import it with
          # `pacman-key --add`, NOT from a keyserver. Arch's
          # /etc/pacman.d/gnupg/gpg.conf configures keyserver-options but no
          # `keyserver` line at all (checked on Omarchy 4.0.4, 2026-09-17), so
          # `pacman-key --recv-keys <fpr>` has nowhere to go and fails with
          # "No keyserver available". Serving the key beside the database keeps
          # the whole channel on one host and needs no third party.
          gpg --armor --export "$FPR" > "$GITHUB_WORKSPACE/diagrammo.gpg"

      # The bootstrap package DELIVERS that public key, so it can only be built
      # after the step above has exported it — and not at all when there is no
      # signing key, since `pacman-key --populate` would then have nothing to
      # import. An unsigned channel is already asking the user to write
      # `SigLevel` by hand, which is the situation this package exists to avoid.
      - name: Build the bootstrap package
        if: steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd packaging/arch/keyring
          # Same immutability rule as the dgmo package above: never republish
          # different bytes under a filename the channel already serves.
          KR_VER=$(awk -F= '/^pkgver=/{print $2}' PKGBUILD)
          KR_REL=$(awk -F= '/^pkgrel=/{print $2}' PKGBUILD)
          KR_NAME="diagrammo-keyring-${KR_VER}-${KR_REL}-any.pkg.tar.zst"
          if gh release view arch-repo --repo "$GITHUB_REPOSITORY" \
               --json assets --jq '.assets[].name' | grep -qxF "$KR_NAME"; then
            echo "::notice::$KR_NAME is already published — reusing it. Bump pkgrel in packaging/arch/keyring/PKGBUILD if the recipe changed."
            exit 0
          fi
          cp "$GITHUB_WORKSPACE/diagrammo.gpg" .
          # 🔴 The fingerprint in diagrammo-trusted is what pacman-key locally
          # signs. If the key is ever rotated and that file is not updated,
          # --populate imports the new key and trusts nothing, and every package
          # fails verification on the user's machine with no hint why. Checked
          # here, where it costs a second.
          FPR_IN_KEY=$(gpg --show-keys --with-colons diagrammo.gpg | awk -F: '/^fpr:/{print $10; exit}')
          if ! grep -q "^${FPR_IN_KEY}:" diagrammo-trusted; then
            echo "::error::diagrammo-trusted does not list ${FPR_IN_KEY}, the fingerprint of the key being shipped. Update packaging/arch/keyring/diagrammo-trusted."
            exit 1
          fi
          bash test-ensure-repo.sh ./ensure-repo.sh
          chown -R builder .
          sudo -u builder makepkg --noconfirm --clean
          # The database is assembled from packaging/arch, so the artifact has
          # to land there to be picked up.
          cp ./*.pkg.tar.zst ../
          ls -la ../*.pkg.tar.zst

      - name: Assemble the repository database
        env:
          GH_TOKEN: ${{ github.token }}
          PASSPHRASE: ${{ secrets.ARCH_SIGNING_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p repo && cd repo
          cp ../packaging/arch/*.pkg.tar.zst .
          [ -e ../diagrammo.gpg ] && cp ../diagrammo.gpg . || true

          # Carry forward whatever is already published, so a future second
          # package in this repository is not dropped by a run that only
          # rebuilds the first. Absent on the very first run, hence `|| true`.
          gh release download arch-repo --repo "$GITHUB_REPOSITORY" \
            --pattern '*.pkg.tar.zst' --skip-existing || true

          # 🔴 `diagrammo-keyring.pkg.tar.zst` is a fixed-name ALIAS of the
          # versioned bootstrap package, published so the documented join URL
          # never changes. The carry-forward above brings it back, and left here
          # `repo-add` would index it as a second copy of the same package and
          # could point the database at the alias — after which the drop loop
          # below deletes the versioned file the database no longer names. It is
          # recreated from this run's package further down.
          rm -f diagrammo-keyring.pkg.tar.zst diagrammo-keyring.pkg.tar.zst.sig

          SIGN_ARGS=()
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            for pkg in ./*.pkg.tar.zst; do
              gpg --batch --yes --pinentry-mode loopback \
                ${PASSPHRASE:+--passphrase "$PASSPHRASE"} \
                --detach-sign --no-armor "$pkg"
            done
            # `-s` signs the database itself; `-v` verifies each package's
            # signature as it is added, so a bad .sig fails here rather than on
            # somebody's machine.
            SIGN_ARGS=(-s -v)
          fi

          repo-add "${SIGN_ARGS[@]}" diagrammo.db.tar.gz ./*.pkg.tar.zst

          # 🔴 The carry-forward above brings back EVERY version of every
          # package the release holds, and `repo-add` keeps one entry per
          # package name — so the version it just superseded is still sitting
          # here, 10 MB of it, with nothing in the database that can ever point
          # at it again. Uploaded, it would grow the release by a package per
          # release forever. Keep exactly what the database lists: that still
          # carries a genuine second package forward, which is what the download
          # is for, and drops only what this run replaced.
          KEEP=$(bsdtar -xOf diagrammo.db.tar.gz '*/desc' |
                   awk '/^%FILENAME%$/{getline; print}')
          for pkg in ./*.pkg.tar.zst; do
            name=${pkg#./}
            if ! printf '%s\n' "$KEEP" | grep -qxF "$name"; then
              echo "dropping superseded package: $name"
              rm -f "$pkg" "$pkg.sig"
            fi
          done

          # 🔴 repo-add leaves `diagrammo.db` as a SYMLINK to the tarball, and a
          # GitHub release asset is a flat file — a symlink uploads as its own
          # 19-byte text. pacman requests `<repo>.db`, so both names must be
          # real files with the same bytes.
          for base in db files; do
            rm -f "diagrammo.$base"
            cp "diagrammo.$base.tar.gz" "diagrammo.$base"
            if [ -e "diagrammo.$base.tar.gz.sig" ]; then
              rm -f "diagrammo.$base.sig"
              cp "diagrammo.$base.tar.gz.sig" "diagrammo.$base.sig"
            fi
          done

          # The fixed-name alias, made last so the drop loop above cannot eat it
          # and `repo-add` never saw it. The database points at the versioned
          # file; this is only here so the README's curl line is stable.
          for pkg in ./diagrammo-keyring-*.pkg.tar.zst; do
            [ -e "$pkg" ] || continue
            cp "$pkg" diagrammo-keyring.pkg.tar.zst
            [ -e "$pkg.sig" ] && cp "$pkg.sig" diagrammo-keyring.pkg.tar.zst.sig
          done
          ls -la

      - name: Publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd repo
          # 🔴 `--clobber` replaces an asset, it never removes one. A run that
          # publishes UNSIGNED after a signed one would otherwise leave the old
          # `.sig` and `diagrammo.gpg` assets in place — and under a
          # `SigLevel = Required` client those stale signatures are worse than
          # no signatures, because they are checked and fail. Drop anything this
          # run did not produce.
          for stale in $(gh release view arch-repo --repo "$GITHUB_REPOSITORY" \
                           --json assets --jq '.assets[].name'); do
            [ -e "$stale" ] && continue
            echo "removing stale asset: $stale"
            gh release delete-asset arch-repo "$stale" --repo "$GITHUB_REPOSITORY" --yes
          done
          gh release upload arch-repo --repo "$GITHUB_REPOSITORY" --clobber ./*
          {
            echo "### Arch repository published"
            echo
            echo "\`dgmo ${{ steps.target.outputs.version }}\` is now served from the \`arch-repo\` release."
            if [ -e diagrammo-keyring.pkg.tar.zst ]; then
              echo
              echo "Joining the channel is two commands:"
              echo
              echo '```bash'
              echo "curl -LO https://github.com/$GITHUB_REPOSITORY/releases/download/arch-repo/diagrammo-keyring.pkg.tar.zst"
              echo "sudo pacman -U ./diagrammo-keyring.pkg.tar.zst"
              echo '```'
            fi
            if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
              echo "Signed by \`${{ steps.signing.outputs.fingerprint }}\`."
            else
              echo "🔴 **UNSIGNED** — \`ARCH_SIGNING_KEY\` is not set on this repository."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

name: Verify NPM Token Scope

# Throwaway workflow — verifies that the org-level NPM_TOKEN secret has
# write access to both @diagrammo/* and the unscoped wrapper packages,
# by performing an idempotent dist-tag round-trip on each (add + remove).
# Delete after a successful run.

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami

      - name: Verify write access via dist-tag round-trip
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          fail=0
          for pkg in @diagrammo/dgmo @diagrammo/dgmo-mcp remark-dgmo astro-dgmo docusaurus-plugin-dgmo fumadocs-dgmo; do
            version=$(npm view "$pkg" version)
            echo "::group::$pkg @ $version"
            if npm dist-tag add "$pkg@$version" verify-token-tmp 2>&1; then
              npm dist-tag rm "$pkg" verify-token-tmp || true
              echo "OK $pkg"
            else
              echo "::error::FAIL $pkg — token cannot write"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

name: Dependabot auto-merge

# Merges a Dependabot pull request once CI has passed on it
# (diagrammo/diagrammo#1506). It runs on `workflow_run`, after CI finishes, so
# the merge waits on the checks without branch protection. No step checks out
# or runs the pull request's code. A bump that changes the major version, or a
# title that is not a single bump, is left for a human.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Merge when the bump keeps the major version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          [ -n "$PR" ] || { echo "no pull request on this run"; exit 0; }
          author=$(gh pr view "$PR" --json author --jq .author.login)
          title=$(gh pr view "$PR" --json title --jq .title)
          [ "$author" = "app/dependabot" ] || { echo "#$PR is by $author — skipped"; exit 0; }
          re='[Bb]ump .+ from v?([0-9]+)[^ ]* to v?([0-9]+)'
          if ! [[ $title =~ $re ]]; then
            echo "#$PR is not a single bump ($title) — left for a human"; exit 0
          fi
          if [ "${BASH_REMATCH[1]}" != "${BASH_REMATCH[2]}" ]; then
            echo "#$PR changes the major version ($title) — left for a human"; exit 0
          fi
          # --match-head-commit: merge only the commit CI tested.
          gh pr merge "$PR" --squash --delete-branch --match-head-commit "$SHA"

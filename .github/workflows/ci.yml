name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Reject legacy alias syntaxes (TD-18)
        run: bash scripts/lint-no-legacy-alias.sh

      - name: Typecheck
        run: pnpm typecheck

      # Epic 106 — noUncheckedIndexedAccess migration. Strict-check
      # runs against tsconfig.strict.json, which only includes folders
      # that have been migrated. continue-on-error keeps this
      # informational until Story 106.18 flips the flag globally.
      - name: Typecheck (strict — Epic 106 migration)
        run: pnpm typecheck:strict
        continue-on-error: true

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Gallery snapshot
        run: pnpm gallery:snapshot

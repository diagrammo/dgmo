name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Reject legacy alias syntaxes (TD-18)
        run: bash scripts/lint-no-legacy-alias.sh

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Epic 105 Story 105.NEW / Epic 106 Story 106.2 — public type
      # surface diff. dgmo's published .d.ts files are consumed by 7
      # downstream packages; strictness changes can leak as breaking
      # type changes if not caught here.
      - name: API surface diff
        run: bash scripts/check-api.sh check

      - name: Gallery snapshot
        run: pnpm gallery:snapshot

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # tests/embed-clipping.test.ts scans the sibling dgmo-content checkout
      # (../dgmo-content/examples), mirroring the local workspace layout.
      - name: Clone dgmo-content sibling
        run: |
          cd ..
          git clone --depth 1 https://github.com/diagrammo/dgmo-content.git

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Installed dependency tree matches lockfile
        run: pnpm check:install-lock

      # Covers src/ only, and src/map/data is excluded in .prettierignore —
      # that whole directory is emitted by scripts/build-map-data.mjs, and
      # PROVENANCE.json records each asset's sha256, so reformatting one would
      # make the audit trail wrong. Added 2026-08-29: nothing had ever run this
      # and three files had drifted (#531).
      - name: Formatting
        run: pnpm format:check

      # Named explicitly rather than `pnpm check:all`, whose superset pulls in
      # pnpm audit / publint / attw — those genuinely are flaky here.
      #
      # Everything else in check:all belongs on a push. Until 2026-08-10 this
      # step ran only the first three, and the comment claimed the rest was
      # "covered elsewhere". It was not: spelling, circular and dep-ranges fired
      # ONLY inside ./release.sh, so they rotted unseen and all three failed at
      # once during the 0.65.0 cut — including a real map import cycle that had
      # already shipped in 0.64.0 and 0.64.1. A gate nobody meets until they are
      # mid-release is a gate that gets bypassed.
      - name: Hygiene checks (dead code, duplication, deps)
        run: pnpm check:deadcode && pnpm check:duplication && pnpm check:deps

      - name: Spelling
        run: pnpm check:spelling

      - name: Circular dependencies
        run: pnpm check:circular

      # Asks the registry what each declared @diagrammo range can actually
      # reach. Degrades to a quiet skip with no network, so an npm outage
      # cannot fail the build.
      - name: Dependency ranges reach what is published
        run: pnpm check:dep-ranges

      - name: Reject legacy alias syntaxes (TD-18)
        run: bash scripts/lint-no-legacy-alias.sh

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Deterministic bundle-size regression guard (gzip, not timing — the 1.0
      # perf gate). dist/ is already built by the step above. If an intended
      # change grows the bundle, run `pnpm check:size:update` and commit the new
      # .bundle-baseline.json.
      - name: Bundle-size guard
        run: node scripts/check-bundle-size.cjs

      # Epic 105 Story 105.NEW / Epic 106 Story 106.2 — public type
      # surface diff. dgmo's published .d.ts files are consumed by 7
      # downstream packages; strictness changes can leak as breaking
      # type changes if not caught here.
      - name: API surface diff
        run: node --test scripts/check-api.test.mjs && bash scripts/check-api.sh check

      - name: Gallery snapshot
        run: pnpm gallery:snapshot

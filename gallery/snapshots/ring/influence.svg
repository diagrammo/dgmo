t-size="14"><tspan>Second-in-command, arbitrates</tspan></text><text x="733.24" y="378" text-anchor="start" fill="#4c566a" font-family="Inter, system-ui, Avenir, Helvetica, Arial, sans-serif" font-size="14"><tspan>disputes, divvies the booty.</tspan></text></g><g class="ring-desc" data-line-number="11"><rect x="718.24" y="397" width="3" height="56" rx="1.5" fill="#a3be8c"></rect><text x="733.24" y="410" text-anchor="start" fill="#2e3440" font-family="Inter, system-ui, Avenir, Helvetica, Arial, sans-serif" font-size="14" font-weight="600"><tspan>Crew</tspan></text><text x="733.24" y="423" text-anchor="start" fill="#4c566a" font-family="Inter, system-ui, Avenir, Helvetica, Arial, sans-serif" font-size="14"><tspan>Deckhands, gunners, and powder</tspan></text><text x="733.24" y="442" text-anchor="start" fill="#4c566a" font-family="Inter, system-ui, Avenir, Helvetica, Arial, sans-serif" font-size="14"><tspan>monkeys aboard the ship.</tspan></text></g><g class="ring-desc" data-line-number="15"><rect x="718.24" y="461" width="3" height="56" rx="1.5" fill="#d08770"></rect><text x="733.24" y="474" text-anchor="start" fill="#2e3440" font-family="Inter, system-ui, Avenir, Helvetica, Arial, sans-serif" font-size="14" font-weight="600"><tspan>Allied Crews</tspan></text><text x="733.24" y="487" text-anchor="start" fill="#4c566a" font-family="Inter, system-ui, Avenir, Helvetica, Arial, sans-serif" font-size="14"><tspan>Loose alliances kept by oath</tspan></text><text x="733.24" y="506" text-anchor="start" fill="#4c566a" font-family="Inter, system-ui, Avenir, Helvetica, Arial, sans-serif" font-size="14"><tspan>or shared bounty in fair seas.</tspan></text></g><g class="ring-desc" data-line-number="19"><rect x="718.24" y="525" width="3" height="56" rx="1.5" fill="#88c0d0"></rect><text x="733.24" y="538" text-anchor="start" fill="#2e3440" font-family="Inter, system-ui, Avenir, Helvetica, Arial, sans-serif" font-size="14" font-weight="600"><tspan>The Open Sea</tspan></text><text x="733
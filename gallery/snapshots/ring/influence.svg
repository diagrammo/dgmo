<svg aria-describedby="dgmo-desc-fce72ea2" role="img" aria-label="Captain's Sphere of Influence — Ring diagram" width="1200" height="800" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" style="font-family: Inter, system-ui, Avenir, Helvetica, Arial, sans-serif; background: rgb(236, 239, 244);"><desc id="dgmo-desc-fce72ea2">Ring diagram of 5 layers, centre outward: Captain, Quartermaster, Crew, Allied Crews and The Open Sea.</desc><style>.ring-layer:hover{filter:saturate(1.4) brightness(1.06)}.ring-layer{transition:filter .12s ease, opacity .12s ease}</style><rect class="dgmo-canvas-bg" x="0" y="0" width="1200" height="800" fill="#eceff4"></rect><text class="chart-title" x="35.5" y="30" text-anchor="start" fill="#2e3440" font-family="Inter, system-ui, Avenir, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" data-line-number="1" style="cursor: default;">Captain's Sphere of Influence</text><g class="ring-body"><g class="ring-layer" data-line-number="3"><circle cx="363.12" cy="422" r="65.424" fill="#ded7e2" stroke="#2e3440" stroke-width="1" stroke-opacity="0.4"></circle></g><g class="ring-layer" data-line-number="7"><path d="M 232.272 422 A 130.848 130.848 0 1 0 493.968 422 A 130.848 130.848 0 1 0 232.272 422 M 297.696 422 A 65.424 65.424 0 1 0 428.544 422 A 65.424 65.424 0 1 0 297.696 422 Z" fill-rule="evenodd" fill="#c9d4e2" stroke="#2e3440" stroke-width="1" stroke-opacity="0.4"></path></g><g class="ring-layer" data-line-number="11"><path d="M 166.84799999999998 422 A 196.27200000000002 196.27200000000002 0 1 0 559.392 422 A 196.27200000000002 196.27200000000002 0 1 0 166.84799999999998 422 M 232.272 422 A 130.848 130.848 0 1 0 493.968 422 A 130.848 130.848 0 1 0 232.272 422 Z" fill-rule="evenodd" fill="#dae3da" stroke="#2e3440" stroke-width="1" stroke-opacity="0.4"></path></g><g class="ring-layer" data-line-number="15"><path d="M 101.42399999999998 422 A 261.696 261.696 0 1 0 624.816 422 A 261.696 261.696 0 1 0 101.42399999999998 422 M 166.84799999999998 422 A 196.27200000000002 196.27200000000002 0 1 0 559.392 422 A 196.27200000000002 196.27200000000002 0 1 0 166.84799999999998 422 Z" fill-rule="evenodd" fill="#e5d5d3" stroke="#2e3440" stroke-width="1" stroke-opacity="0.4"></path></g><g class="ring-layer" data-line-number="19"><path d="M 36 422 A 327.12 327.12 0 1 0 690.24 422 A 327.12 327.12 0 1 0 36 422 M 101.42399999999998 422 A 261.696 261.696 0 1 0 624.816 422 A 261.696 261.696 0 1 0 101.42399999999998 422 Z" fill-rule="evenodd" fill="#d3e3eb" stroke="#2e3440" stroke-width="1" stroke-opacity="0.4"></path></g></g><g class="ring-labels"><defs><path id="dgmo-ring-lbl-0" d="M 287.04 371.89 A 91.10 91.10 0 0 1 439.20 371.89"></path><path id="dgmo-ring-lbl-1" d="M 330.84 268.85 A 156.52 156.52 0 0 1 395.40 268.85"></path><path id="dgmo-ring-lbl-2" d="M 287.24 213.43 A 221.94 221.94 0 0 1 439.00 213.43"></path><path id="dgmo-ring-lbl-3" d="M 278.95 147.24 A 287.37 287.37 0 0 1 447.29 147.24"></path></defs><g class="ring-label-group" data-line-number="3"><text class="ring-label" x="363.12" y="422" dy="0.35em" text-anchor="middle" fill="#2e3440" font-family="Inter, system-ui, Avenir, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" style="pointer-events: none;"><tspan>Captain</tspan></text></g><g class="ring-label-group" data-line-number="7"><text class="ring-label" fill="#2e3440" font-family="Inter, system-ui, Avenir, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" style="pointer-events: none;"><textPath href="#dgmo-ring-lbl-0" startOffset="50%" text-anchor="middle"><tspan>Quartermaster</tspan></textPath></text></g><g class="ring-label-group" data-line-number="11"><text class="ring-label" fill="#2e3440" font-family="Inter, system-ui, Avenir, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" style="pointer-events: none;"><textPath href="#dgmo-ring-lbl-1" startOffset="50%" text-anchor="middle"><tspan>Crew</tspan></textPath></text></g><g class="ring-label-group" data-line-number="15"><text class="ring-label" fill="#2e3440" font-family="Inter, system-ui, Avenir, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" style="pointer-events: none;"><textPath href="#dgmo-ring-lbl-2" startOffset="50%" text-anchor="middle"><tspan>Allied Crews</tspan></textPath></text></g><g class="ring-label-group" data-line-number="19"><text class="ring-label" fill="#2e3440" font-family="Inter, system-ui, Avenir, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" style="pointer-events: none;"><textPath href="#dgmo-ring-lbl-3" startOffset="50%" text-anchor="middle"><tspan>The Open Sea</tspan></textPath></text></g></g><g class="ring-descriptions"><g class="ring-desc" data-line-number="3"><rect x="718.24" y="266" width="3" height="56" rx="1.5" fill="#b48ead"></rect><text x="733.24" y="279" text-anchor="start" fill="#2e3440" font-family="Inter, system-ui, Avenir, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold"><tspan>Captain</tspan></text><text x="733.24" y="292" text-anchor="start" fill="#4c566a" font-family="Inter, system-ui, Avenir, Helvetica, Arial, sans-serif" font-size="14"><tspan>Final word on heading and plunder, keeper of the</tspan></text><text x="733.24" y="311" text-anchor="start" fill="#4c566a" font-family="Inter, system-ui, Avenir, Helvetica, Arial, sans-serif" font-size="14"><tspan>ship's charter.</tspan></text></g><g class="ring-desc" data-line-number="7"><rect x="718.24" y="330" width="3" height="56" rx="1.5" fill="#5e81ac"></rect><text x="733.24" y="343" text-anchor="start" fill="#2e3440" font-family="Inter, system-ui, Avenir, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold"><tspan>Quartermaster</tspan></text><text x="733.24" y="356" text-anchor="start" fill="#4c566a" font-family="Inter, system-ui, Avenir, Helvetica, Arial, sans-serif" font-size="14"><tspan>Second-in-command, arbitrates disputes, divvies the</tspan></text><text x="733.24" y="375" text-anchor="start" fill="#4c566a" font-family="Inter, system-ui, Avenir, Helvetica, Arial, sans-serif" font-size="14"><tspan>booty.</tspan></text></g><g class="ring-desc" data-line-number="11"><rect x="718.24" y="394" width="3" height="56" rx="1.5" fill="#a3be8c"></rect><text x="733.24" y="407" text-anchor="start" fill="#2e3440" font-family="Inter, system-ui, Avenir, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold"><tspan>Crew</tspan></text><text x="733.24" y="420" text-anchor="start" fill="#4c566a" font-family="Inter, system-ui, Avenir, Helvetica, Arial, sans-serif" font-size="14"><tspan>Deckhands, gunners, and powder monkeys aboard the</tspan></text><text x="733.24" y="439" text-anchor="start" fill="#4c566a" font-family="Inter, system-ui, Avenir, Helvetica, Arial, sans-serif" font-size="14"><tspan>ship.</tspan></text></g><g class="ring-desc" data-line-number="15"><rect x="718.24" y="458" width="3" height="56" rx="1.5" fill="#d08770"></rect><text x="733.24" y="471" text-anchor="start" fill="#2e3440" font-family="Inter, system-ui, Avenir, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold"><tspan>Allied Crews</tspan></text><text x="733.24" y="484" text-anchor="start" fill="#4c566a" font-family="Inter, system-ui, Avenir, Helvetica, Arial, sans-serif" font-size="14"><tspan>Loose alliances kept by oath or shared bounty in</tspan></text><text x="733.24" y="503" text-anchor="start" fill="#4c566a" font-family="Inter, system-ui, Avenir, Helvetica, Arial, sans-serif" font-size="14"><tspan>fair seas.</tspan></text></g><g class="ring-desc" data-line-number="19"><rect x="718.24" y="522" width="3" height="56" rx="1.5" fill="#88c0d0"></rect><text x="733.24" y="535" text-anchor="start" fill="#2e3440" font-family="Inter, system-ui, Avenir, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold"><tspan>The Open Sea</tspan></text><text x="733.24" y="548" text-anchor="start" fill="#4c566a" font-family="Inter, system-ui, Avenir, Helvetica, Arial, sans-serif" font-size="14"><tspan>Weather, currents, and rival flags beyond any</tspan></text><text x="733.24" y="567" text-anchor="start" fill="#4c566a" font-family="Inter, system-ui, Avenir, Helvetica, Arial, sans-serif" font-size="14"><tspan>captain's reach.</tspan></text></g></g></svg>
<svg role="img" aria-label="Flowchart diagram" width="1200" height="1700" viewBox="0 0 1200 1700" preserveAspectRatio="xMidYMin meet" style="font-family: Inter, system-ui, Avenir, Helvetica, Arial, sans-serif; background: rgb(236, 239, 244);" xmlns="http://www.w3.org/2000/svg"><style>.fc-node:hover{filter:saturate(1.4) brightness(1.06)}.fc-node{transition:filter .12s ease, opacity .12s ease}@media (hover:hover){svg:has(.fc-node[data-node-id="terminal:start"]:hover) .fc-edge-group:not([data-source="terminal:start"]):not([data-target="terminal:start"]){opacity:0.4}svg:has(.fc-node[data-node-id="io:get input"]:hover) .fc-edge-group:not([data-source="io:get input"]):not([data-target="io:get input"]){opacity:0.4}svg:has(.fc-node[data-node-id="decision:valid?"]:hover) .fc-edge-group:not([data-source="decision:valid?"]):not([data-target="decision:valid?"]){opacity:0.4}svg:has(.fc-node[data-node-id="process:process data"]:hover) .fc-edge-group:not([data-source="process:process data"]):not([data-target="process:process data"]){opacity:0.4}svg:has(.fc-node[data-node-id="terminal:done"]:hover) .fc-edge-group:not([data-source="terminal:done"]):not([data-target="terminal:done"]){opacity:0.4}svg:has(.fc-node[data-node-id="process:show error"]:hover) .fc-edge-group:not([data-source="process:show error"]):not([data-target="process:show error"]){opacity:0.4}}</style><rect class="dgmo-canvas-bg" x="0" y="0" width="1200" height="1700" fill="#eceff4"></rect><defs><marker id="fc-arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto"><polygon points="0,0 10,3.5 0,7" fill="#4c566a"></polygon></marker></defs><text class="chart-title" x="600" y="30" text-anchor="middle" fill="#2e3440" font-size="20" font-weight="bold" style="cursor: default;" data-line-number="1">Decision Flow</text><g transform="translate(48, 60) scale(3)"><g class="fc-edge-group" data-line-number="3" data-source="terminal:start" data-target="io:get input"><path d="M253,50L253,55C253
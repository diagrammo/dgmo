<svg aria-describedby="dgmo-desc-027f4b03" role="img" aria-label="Tortuga Rum Co. — Swot diagram" xmlns="http://www.w3.org/2000/svg" width="672" height="306" viewBox="0 0 672 306" preserveAspectRatio="xMidYMin meet" font-family="Inter, system-ui, Avenir, Helvetica, Arial, sans-serif" style="background: rgb(236, 239, 244); font-family: Inter, system-ui, Avenir, Helvetica, Arial, sans-serif;"><desc id="dgmo-desc-027f4b03">SWOT analysis with 7 items: Strengths 2, Weaknesses 2, Opportunities 1, Threats 2.</desc><style>@media (hover:hover){svg:has(.swot-panel:hover) .swot-panel:not(:hover){opacity:0.4}}</style><rect class="dgmo-canvas-bg" x="0" y="0" width="672" height="306" fill="#eceff4"></rect><text class="chart-title" data-line-number="1" x="20" y="40" font-size="20" font-weight="bold" fill="#2e3440">Tortuga Rum Co.</text><g class="swot-axes"><text font-size="11" fill="#4c566a" text-anchor="middle" x="190" y="60" dominant-baseline="central">Helpful</text><text font-size="11" fill="#4c566a" text-anchor="middle" x="502" y="60" dominant-baseline="central">Harmful</text><text font-size="11" fill="#4c566a" text-anchor="middle" x="30" y="121" dominant-baseline="central" transform="rotate(-90 30 121)">Internal</text><text font-size="11" fill="#4c566a" text-anchor="middle" x="30" y="235" dominant-baseline="central" transform="rotate(-90 30 235)">External</text></g><g class="swot-panel" data-section="strengths" data-line-number="3"><rect x="40" y="70" width="300" height="102" rx="8" fill="#eaedf3"></rect><path class="swot-header" d="M40,104V78Q40,70 48,70H332Q340,70 340,78V104Z" fill="#cfdbcc"></path><text x="52" y="87" dominant-baseline="central" font-size="13" font-weight="bold" fill="#2e3440">Strengths</text><g class="swot-item" data-line-number="4"><circle cx="55.5" cy="125" r="3.5" fill="#a3be8c"></circle><text x="67" y="125" dominant-baseline="central" font-size="13" fill="#2e3440">Oldest still on the island</text></g><g class="swot-item" data-line-number="5"><circle cx="55.5" cy="151" r="3.5" fill="#a3be8c"></circle><text x="67" y="151" dominant-baseline="central" font-size="13" fill="#2e3440">Crew of 40 sworn tasters</text></g></g><g class="swot-panel" data-section="weaknesses" data-line-number="6"><rect x="352" y="70" width="300" height="102" rx="8" fill="#eaedf3"></rect><path class="swot-header" d="M352,104V78Q352,70 360,70H644Q652,70 652,78V104Z" fill="#eae0cb"></path><text x="364" y="87" dominant-baseline="central" font-size="13" font-weight="bold" fill="#2e3440">Weaknesses</text><g class="swot-item" data-line-number="7"><circle cx="367.5" cy="125" r="3.5" fill="#ebcb8b"></circle><text x="379" y="125" dominant-baseline="central" font-size="13" fill="#2e3440">One barrel supplier</text></g><g class="swot-item" data-line-number="8"><circle cx="367.5" cy="151" r="3.5" fill="#ebcb8b"></circle><text x="379" y="151" dominant-baseline="central" font-size="13" fill="#2e3440">Cost: 20% above rivals, margins thin</text></g></g><g class="swot-panel" data-section="opportunities" data-line-number="9"><rect x="40" y="184" width="300" height="102" rx="8" fill="#eaedf3"></rect><path class="swot-header" d="M40,218V192Q40,184 48,184H332Q340,184 340,192V218Z" fill="#b5c4d8"></path><text x="52" y="201" dominant-baseline="central" font-size="13" font-weight="bold" fill="#2e3440">Opportunities</text><g class="swot-item" data-line-number="10"><circle cx="55.5" cy="239" r="3.5" fill="#5e81ac"></circle><text x="67" y="239" dominant-baseline="central" font-size="13" fill="#2e3440">Navy rum ration contract</text></g></g><g class="swot-panel" data-section="threats" data-line-number="11"><rect x="352" y="184" width="300" height="102" rx="8" fill="#eaedf3"></rect><path class="swot-header" d="M352,218V192Q352,184 360,184H644Q652,184 652,192V218Z" fill="#dab8bf"></path><text x="364" y="201" dominant-baseline="central" font-size="13" font-weight="bold" fill="#2e3440">Threats</text><g class="swot-item" data-line-number="12"><circle cx="367.5" cy="239" r="3.5"
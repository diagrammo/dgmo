eprise chaque hiver</text></g><g class="swot-item" data-line-number="19"><circle cx="35.5" cy="208" r="3.5" fill="#a3be8c"></circle><text x="47" y="208" dominant-baseline="central" font-size="13" fill="#2e3440">Recette gardée depuis 1680</text></g></g><g class="swot-panel" data-section="weaknesses" data-line-number="13"><rect x="332" y="50" width="300" height="179" rx="8" fill="#eaedf3"></rect><path class="swot-header" d="M332,84V58Q332,50 340,50H624Q632,50 632,58V84Z" fill="#eae0cb"></path><text x="344" y="67" dominant-baseline="central" font-size="13" font-weight="bold" fill="#2e3440">Faiblesses</text><g class="swot-item" data-line-number="14"><circle cx="347.5" cy="105" r="3.5" fill="#ebcb8b"></circle><text x="359" y="105" dominant-baseline="central" font-size="13" fill="#2e3440">Un seul fournisseur de tonneaux</text></g></g><g class="swot-panel" data-section="opportunities" data-line-number="9"><rect x="20" y="241" width="300" height="146" rx="8" fill="#eaedf3"></rect><path class="swot-header" d="M20,275V249Q20,241 28,241H312Q320,241 320,249V275Z" fill="#c7dade"></path><text x="32" y="258" dominant-baseline="central" font-size="13" font-weight="bold" fill="#2e3440">Opportunités</text><g class="swot-item" data-line-number="10"><circle cx="35.5" cy="296" r="3.5" fill="#8fbcbb"></circle><text x="47" y="296" dominant-baseline="central" font-size="13" fill="#2e3440">Contrat de ration de rhum pour la marine</text></g><g class="swot-item" data-line-number="11"><circle cx="35.5" cy="322" r="3.5" fill="#8fbcbb"></circle><text x="47" y="322" dominant-baseline="central" font-size="13" fill="#2e3440">Ouverture d'une route commerciale vers</text><text x="47" y="340" dominant-baseline="central" font-size="13" fill="#2e3440">les îles du sud</text></g><g class="swot-item" data-line-number="12"><circle cx="35.5" cy="366" r="3.5" fill="#8fbcbb"></circle><text x="47" y="366" dominant-baseline="central" font-size="13" fill="#2e3440">Demande croissante en Europe</text></g></g><g cla
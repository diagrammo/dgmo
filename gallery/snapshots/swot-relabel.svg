<svg aria-describedby="dgmo-desc-adb2b881" role="img" aria-label="Coopérative du Rhum — Swot diagram" xmlns="http://www.w3.org/2000/svg" width="652" height="417" viewBox="0 0 652 417" preserveAspectRatio="xMidYMin meet" font-family="Inter, system-ui, Avenir, Helvetica, Arial, sans-serif" style="background: rgb(236, 239, 244); font-family: Inter, system-ui, Avenir, Helvetica, Arial, sans-serif;"><desc id="dgmo-desc-adb2b881">SWOT analysis with 8 items: Forces 3, Faiblesses 1, Opportunités 3, Menaces 1.</desc><style>@media (hover:hover){svg:has(.swot-panel:hover) .swot-panel:not(:hover){opacity:0.4}svg:has(.swot-axis[data-swot-axis="col-0"]:hover) :is(.swot-panel:not([data-swot-col="0"]),.swot-axis:not([data-swot-axis="col-0"])){opacity:0.4}svg:has(.swot-axis[data-swot-axis="col-1"]:hover) :is(.swot-panel:not([data-swot-col="1"]),.swot-axis:not([data-swot-axis="col-1"])){opacity:0.4}svg:has(.swot-axis[data-swot-axis="row-0"]:hover) :is(.swot-panel:not([data-swot-row="0"]),.swot-axis:not([data-swot-axis="row-0"])){opacity:0.4}svg:has(.swot-axis[data-swot-axis="row-1"]:hover) :is(.swot-panel:not([data-swot-row="1"]),.swot-axis:not([data-swot-axis="row-1"])){opacity:0.4}}</style><rect class="dgmo-canvas-bg" x="0" y="0" width="652" height="417" fill="#eceff4"></rect><text class="chart-title" data-line-number="1" x="20" y="30" font-size="20" font-weight="bold" fill="#2e3440" text-anchor="start">Coopérative du Rhum</text><g class="swot-panel" data-section="strengths" data-swot-col="0" data-swot-row="0" data-line-number="15"><rect x="20" y="60" width="300" height="179" rx="8" fill="#eaedf3"></rect><path class="swot-header" d="M20,94V68Q20,60 28,60H312Q320,60 320,68V94Z" fill="#cfdbcc"></path><text x="32" y="77" dominant-baseline="central" font-size="13" font-weight="bold" fill="#2e3440">Forces</text><g class="swot-item" data-line-number="16"><circle cx="35.5" cy="115" r="3.5" fill="#a3be8c"></circle><text x="47" y="115" dominant-baseline="central" font-size="13" fill="#2e3440">La plus ancienne distillerie de l'île</text></g><g class="swot-item" data-line-number="17"><circle cx="35.5" cy="141" r="3.5" fill="#a3be8c"></circle><text x="47" y="141" dominant-baseline="central" font-size="13" fill="#2e3440">Quarante goûteurs assermentés, formés</text><text x="47" y="159" dominant-baseline="central" font-size="13" fill="#2e3440">dans trois ports différents et capables de</text><text x="47" y="177" dominant-baseline="central" font-size="13" fill="#2e3440">reconnaître un millésime à l'odeur</text><text class="swot-detail" x="47" y="193.5" dominant-baseline="central" font-size="11" fill="#4c566a">Formation reprise chaque hiver</text></g><g class="swot-item" data-line-number="19"><circle cx="35.5" cy="218" r="3.5" fill="#a3be8c"></circle><text x="47" y="218" dominant-baseline="central" font-size="13" fill="#2e3440">Recette gardée depuis 1680</text></g></g><g class="swot-panel" data-section="weaknesses" data-swot-col="1" data-swot-row="0" data-line-number="13"><rect x="332" y="60" width="300" height="179" rx="8" fill="#eaedf3"></rect><path class="swot-header" d="M332,94V68Q332,60 340,60H624Q632,60 632,68V94Z" fill="#eae0cb"></path><text x="344" y="77" dominant-baseline="central" font-size="13" font-weight="bold" fill="#2e3440">Faiblesses</text><g class="swot-item" data-line-number="14"><circle cx="347.5" cy="115" r="3.5" fill="#ebcb8b"></circle><text x="359" y="115" dominant-baseline="central" font-size="13" fill="#2e3440">Un seul fournisseur de tonneaux</text></g></g><g class="swot-panel" data-section="opportunities" data-swot-col="0" data-swot-row="1" data-line-number="9"><rect x="20" y="251" width="300" height="146" rx="8" fill="#eaedf3"></rect><path class="swot-header" d="M20,285V259Q20,251 28,251H312Q320,251 320,259V285Z" fill="#c7dade"></path><text x="32" y="268" dominant-baseline="central" font-size="13" font-weight="bold" fill="#2e3440">Opportunités</text><g class="swot-item" data-line-number="10"><circle cx="35.5" cy="306" r="3.5" fill="#8fbcbb"></circle><text x="47" y="306" dominant-baseline="central" font-size="13" fill="#2e3440">Contrat de ration de rhum pour la marine</text></g><g class="swot-item" data-line-number="11"><circle cx="35.5" cy="332" r="3.5" fill="#8fbcbb"></circle><text x="47" y="332" dominant-baseline="central" font-size="13" fill="#2e3440">Ouverture d'une route commerciale vers</text><text x="47" y="350" dominant-baseline="central" font-size="13" fill="#2e3440">les îles du sud</text></g><g class="swot-item" data-line-number="12"><circle cx="35.5" cy="376" r="3.5" fill="#8fbcbb"></circle><text x="47" y="376" dominant-baseline="central" font-size="13" fill="#2e3440">Demande croissante en Europe</text></g></g><g class="swot-panel" data-section="threats" data-swot-col="1" data-swot-row="1" data-line-number="7"><rect x="332" y="251" width="300" height="146" rx="8" fill="#eaedf3"></rect><path class="swot-header" d="M332,285V259Q332,251 340,251H624Q632,251 632,259V285Z" fill="#dab8bf"></path><text x="344" y="268" dominant-baseline="central" font-size="13" font-weight="bold" fill="#2e3440">Menaces</text><g class="swot-item" data-line-number="8"><circle cx="347.5" cy="306" r="3.5" fill="#bf616a"></circle><text x="359" y="306" dominant-baseline="central" font-size="13" fill="#2e3440">Blocus de la marine royale, qui ferme le</text><text x="359" y="324" dominant-baseline="central" font-size="13" fill="#2e3440">port principal pendant toute la saison des</text><text x="359" y="342" dominant-baseline="central" font-size="13" fill="#2e3440">alizés</text></g></g></svg>
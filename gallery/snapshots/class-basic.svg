<svg width="420" height="430" viewBox="0 0 420 430" preserveAspectRatio="xMidYMin meet" style="font-family: Inter, system-ui, Avenir, Helvetica, Arial, sans-serif; background: rgb(236, 239, 244);" xmlns="http://www.w3.org/2000/svg"><style>.cd-class:hover{filter:saturate(1.4) brightness(1.06)}.cd-class{transition:filter .12s ease, opacity .12s ease}@media (hover:hover){svg:has(.cd-class[data-node-id="animal"]:hover) .cd-edge-group:not([data-source="animal"]):not([data-target="animal"]){opacity:0.4}svg:has(.cd-class[data-node-id="dog"]:hover) .cd-edge-group:not([data-source="dog"]):not([data-target="dog"]){opacity:0.4}svg:has(.cd-class[data-node-id="cat"]:hover) .cd-edge-group:not([data-source="cat"]):not([data-target="cat"]){opacity:0.4}}</style><defs><marker id="cd-arrow-inherit" viewBox="0 0 12 8" refX="12" refY="4" markerWidth="12" markerHeight="8" orient="auto"><polygon points="0,0 12,4 0,8" fill="#4c566a" stroke="#4c566a" stroke-width="1"></polygon></marker><marker id="cd-arrow-implement" viewBox="0 0 12 8" refX="12" refY="4" markerWidth="12" markerHeight="8" orient="auto"><polygon points="0,0 12,4 0,8" fill="#eceff4" stroke="#4c566a" stroke-width="1"></polygon></marker><marker id="cd-arrow-compose" viewBox="0 0 12 8" refX="0" refY="4" markerWidth="12" markerHeight="8" orient="auto"><polygon points="6,0 12,4 6,8 0,4" fill="#4c566a" stroke="#4c566a" stroke-width="1"></polygon></marker><marker id="cd-arrow-aggregate" viewBox="0 0 12 8" refX="0" refY="4" markerWidth="12" markerHeight="8" orient="auto"><polygon points="6,0 12,4 6,8 0,4" fill="#eceff4" stroke="#4c566a" stroke-width="1"></polygon></marker><marker id="cd-arrow-depend" viewBox="0 0 12 8" refX="12" refY="4" markerWidth="12" markerHeight="8" orient="auto"><polyline points="0,0 12,4 0,8" fill="none" stroke="#4c566a" stroke-width="1.5"></polyline></marker><marker id="cd-arrow-assoc" viewBox="0 0 12 8" refX="12" refY="4" markerWidth="12" markerHeight="8" orient="auto"><polyline points="0,0 12,4 0,8" fill="none" stroke="#4c566a" stroke-width="1.5"></polyline></marker></defs><text class="chart-title" x="210" y="30" text-anchor="middle" fill="#2e3440" font-size="20" font-weight="700" style="cursor: default;" data-line-number="1">Animal Hierarchy</text><g transform="translate(20, 60) scale(1)"><g class="cd-edge-group" data-line-number="8" data-source="dog" data-target="animal"><path d="M270,106L270,112.667C270,119.333,270,132.667,263.464,146C256.928,159.333,243.856,172.667,237.32,179.333L230.784,186" fill="none" stroke="#4c566a" stroke-width="1.5" class="cd-edge" marker-end="url(#cd-arrow-inherit)"></path></g><g class="cd-edge-group" data-line-number="12" data-source="cat" data-target="animal"><path d="M70,106L70,112.667C70,119.333,70,132.667,76.536,146C83.072,159.333,96.144,172.667,102.68,179.333L109.216,186" fill="none" stroke="#4c566a" stroke-width="1.5" class="cd-edge" marker-end="url(#cd-arrow-inherit)"></path></g><g transform="translate(170, 248)" class="cd-class" data-line-number="3" data-node-id="animal" data-cd-type="class"><rect x="-70" y="-62" width="140" height="124" rx="3" ry="3" fill="#d5e2e6" stroke="#8fbcbb" stroke-width="1.5"></rect><text x="0" y="-44" text-anchor="middle" dominant-baseline="central" fill="#2e3440" font-size="13" font-weight="bold">Animal</text><line x1="-70" y1="-26" x2="70" y2="-26" stroke="#8fbcbb" stroke-width="0.5" stroke-opacity="0.5"></line><text x="-60" y="-9" dominant-baseline="central" fill="#2e3440" font-size="11">+ name: string</text><text x="-60" y="9" dominant-baseline="central" fill="#2e3440" font-size="11">+ age: number</text><line x1="-70" y1="27" x2="70" y2="27" stroke="#8fbcbb" stroke-width="0.5" stroke-opacity="0.5"></line><text x="-60" y="44" dominant-baseline="central" fill="#2e3440" font-size="11">+ speak(): void</text></g><g transform="translate(270, 53)" class="cd-class" data-line-number="8" data-node-id="dog" data-cd-type="class"><rect x="-70" y="-53" width="140" height="106" rx="3" ry="3" fill="#d5e2e6" stroke="#